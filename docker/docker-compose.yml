# 全栈一键启动（M3）：pg + 语料入库 + API/前端
# 用法：docker compose -f docker/docker-compose.yml up -d --build
# 首次启动：ingest 服务会下载 BGE-M3（约 2GB）做 embedding，
# 入库完成后 api 才可服务——看 `docker compose logs -f ingest` 等待完成。
# 开发期只起 PG：用 docker-compose.dev.yml。
services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: spec-agent-pg
    environment:
      POSTGRES_USER: specagent
      POSTGRES_PASSWORD: specagent
      POSTGRES_DB: specagent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specagent -d specagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build: { context: .., dockerfile: docker/Dockerfile }
    container_name: spec-agent-ingest
    environment:
      SPECAGENT_DSN: postgresql://specagent:specagent@pg:5432/specagent
      HF_HOME: /cache/hf
    volumes:
      - hfcache:/cache/hf
    command: python docker/init_db.py
    depends_on:
      pg: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    container_name: spec-agent-api
    environment:
      SPECAGENT_DSN: postgresql://specagent:specagent@pg:5432/specagent
      HF_HOME: /cache/hf
    ports: ["8000:8000"]
    volumes:
      - hfcache:/cache/hf
    depends_on:
      pg: { condition: service_healthy }
      ingest: { condition: service_completed_successfully }

volumes:
  pgdata:
  hfcache:
