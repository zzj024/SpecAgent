[project]
name = "spec-agent"
version = "0.1.0"
description = "工程标准符合性审查多智能体系统：带证据链的审查报告，证据不足分级拒答"
requires-python = ">=3.11,<3.12"

# 依赖纪律（守则）：每引入一个依赖必须能说出不可替代的理由，随模块推进逐个加入
dependencies = [
    # L0 接口层：FastAPI 原生支持 SSE 流式输出审查过程，这是选它的核心理由
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # 结构化输出：报告 Schema / 证据三元组全靠 Pydantic 约束，全项目数据模型事实标准
    "pydantic>=2.8",
    # PostgreSQL 驱动：psycopg3 是 PG 官方推荐的现代驱动，原生支持服务端游标与二进制协议
    "psycopg[binary]>=3.2",
    # pgvector 的 Python 类型适配（vector(1024) <-> numpy/list），配合 psycopg 使用
    "pgvector>=0.3",
    # PDF 解析：PyMuPDF 速度与版面结构还原度最好，纯本地无 API 成本
    "pymupdf>=1.24",
    # 本地 embedding/rerank 标准加载层：BGE-M3 与 bge-reranker 官方支持，
    # 免自管 tokenizer/pooling；换模型只改模型名
    "sentence-transformers>=3.0",
    # 中文分词：PG 原生全文检索无中文分词器（整句变一个词），
    # BM25 通路必须先分词；zhparser/pg_jieba 需编译扩展，Windows 容器装不了，
    # jieba 纯 Python 零编译是该约束下的唯一选择
    "jieba>=0.42",
    # 编排：显式状态机（State/Node/条件边全显式可审计），比 Chain 的隐式链路
    # 可归因；checkpointer 原生支持断点续跑（M3 评测六的落点），选型见 02-技术方案
    "langgraph>=1.2",
]

[project.optional-dependencies]
# 用 optional-dependencies 而不是 PEP 735 dependency-groups：后者要 pip>=25.1，
# 老 pip 会静默忽略导致"装了 dev 却没 pytest"的假成功
dev = [
    "pytest>=8.0",
    # FastAPI TestClient 的底层依赖
    "httpx>=0.27",
]
# MCP server 用官方 SDK（stdio 传输，Claude Code 接入演示）；懒导入——
# 不装 mcp 不影响主流水线与 pytest。2.x 起类名 MCPServer（1.x 为 FastMCP）
mcp = ["mcp>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# backend/ 是包根：api / agents / core / rag / memory / reliability / safety 顶层可 import
[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["api", "agents", "core", "rag", "memory", "reliability", "safety"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# 让 backend/ 下的包可以直接 import（rag / agents / api ...）
pythonpath = ["backend"]
# 默认只跑快速单测；集成测（需数据库+本地模型）用 pytest -m integration 单独跑
addopts = "-q -m 'not integration'"
markers = [
    "integration: 需要数据库与本地模型的集成测试（-m integration 运行）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
